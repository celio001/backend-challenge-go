name: CI Check Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26.5
      
      - name: Install dependencies
        run: go mod download

      - name: Build and run tests
        run: |
          go mod tidy
          go test ./... -count=1 -v ./... -race