x-app: &app
  image: wallet-service:local
  build:
    context: .
    dockerfile: Dockerfile
  environment: &app-env
    HTTP_ADDR: ":8081"
    DATABASE_URL: postgres://wallet_app:${WALLET_APP_PASSWORD:-wallet_app}@postgres:5432/challenge?sslmode=disable
    OIDC_ISSUER: http://localhost:8080/realms/wallet
    OIDC_DISCOVERY_URL: http://keycloak:8080/realms/wallet
    OIDC_AUDIENCE: wallet-api
    AWS_REGION: us-east-1
    # LocalStack accepts any credentials; real AWS would use a role instead.
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    SQS_ENDPOINT: http://localstack:4566
    EVENTS_QUEUE_NAME: wallet-events.fifo
    WAGER_QUEUE_NAME: wager-transactions.fifo
    WAGER_DLQ_NAME: wager-transactions-dlq.fifo
    # LocalStack reports its account id as the SenderId of every message, so locally only one provider can be mapped.
    # On AWS, map each provider's IAM principal id to its provider id.
    SQS_SENDER_PROVIDER_MAP: "000000000000=provider-a"
    # Tracing is off unless an OTLP endpoint is given (`make up-tracing` points it at the jaeger service below).
    OTEL_SERVICE_NAME: wallet-service
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  networks:
    - backend-challenge-go
  depends_on: &app-deps
    migrate:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
    localstack:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

services:
  backend-challenge-1:
    <<: *app
    ports:
      - "8081:8081"

  backend-challenge-2:
    <<: *app
    ports:
      - "8082:8081"

  backend-challenge-3:
    <<: *app
    ports:
      - "8083:8081"

  migrate:
    image: wallet-service:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://wallet_owner:${WALLET_OWNER_PASSWORD:-wallet_owner}@postgres:5432/challenge?sslmode=disable
    networks:
      - backend-challenge-go
    depends_on:
      db-init:
        condition: service_completed_successfully

  db-init:
    image: postgres:18-alpine
    entrypoint: ["psql"]
    command:
      - -h
      - postgres
      - -U
      - postgres
      - -d
      - challenge
      - -v
      - ON_ERROR_STOP=1
      - -v
      - owner_password=${WALLET_OWNER_PASSWORD:-wallet_owner}
      - -v
      - app_password=${WALLET_APP_PASSWORD:-wallet_app}
      - -f
      - /init/db-init.sql
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./deploy/db-init.sql:/init/db-init.sql:ro
    networks:
      - backend-challenge-go
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: challenge
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - backend-challenge-go
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d challenge"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens carry iss=localhost:8080 whichever address the caller used; backchannel URLs (jwks) follow the caller's host.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    volumes:
      - ./deploy/keycloak-realm.json:/opt/keycloak/data/import/wallet-realm.json:ro
    ports:
      - "8080:8080"
    networks:
      - backend-challenge-go
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  jaeger:
    profiles: ["tracing"]
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"
      - "4318:4318"
    networks:
      - backend-challenge-go

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./deploy/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    ports:
      - "4566:4566"
    networks:
      - backend-challenge-go
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  db_data:

networks:
  backend-challenge-go:
